aid: minicor
name: Minicor
description: >-
  Minicor (operated by Laminar Run, Inc.) is a platform for building and running
  desktop automations at scale using computer-use AI agents. Legacy desktop
  software such as EHRs, ERPs, DMS, WMS and PMS systems often has no API, so the
  only way to read or write data is to drive the desktop like a human. Minicor
  automates these systems reliably: install a desktop client on the machines
  running the legacy software, record a workflow, and trigger a full desktop
  workflow on a Windows VM with a single API call that returns structured JSON.
  Automations are stored as deterministic code for speed while a reasoning model,
  grounding model, reflection agent and OCR handle recovery, adaptation and edge
  cases, self-healing when UIs change. The developer-facing surface is the
  Laminar API (api.laminar.run) for executing workflows and managing
  configuration stores, authenticated with an API key. Minicor is SOC 2 Type II
  and HIPAA compliant and is a Y Combinator (X26) company.
